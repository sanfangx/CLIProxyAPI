name: Build CLIProxyAPI iOS (arm64)

on:
  push:
    branches: [ main, 'feature/**', 'trollstore**' ]
  pull_request:
  workflow_dispatch:

jobs:
  build-ios-arm64:
    name: Build iOS arm64 Binary
    runs-on: macos-15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache: true

      - name: Compile iOS arm64 Binary
        run: |
          mkdir -p dist
          CGO_ENABLED=0 GOOS=ios GOARCH=arm64 go build \
            -trimpath \
            -ldflags="-s -w -X main.Version=v8-ios -X main.Commit=${GITHUB_SHA::8} -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/cli-proxy-api-raw \
            ./cmd/server/

          # 确保 Mach-O LC_BUILD_VERSION 严格声明为 iOS (platform 2)，彻底消除 dyld wrong platform 报错
          xcrun vtool -set-build-version ios 14.0 14.0 -replace -output dist/cli-proxy-api dist/cli-proxy-api-raw
          rm -f dist/cli-proxy-api-raw

          # 打印 Mach-O platform load commands 供验证
          echo "=== Mach-O LC_BUILD_VERSION ==="
          xcrun vtool -show-build dist/cli-proxy-api

          chmod 755 dist/cli-proxy-api
          cp config.example.yaml dist/

      - name: Upload iOS arm64 Binary
        uses: actions/upload-artifact@v4
        with:
          name: CLIProxyAPI-iOS-arm64
          path: dist/*
          if-no-files-found: error
